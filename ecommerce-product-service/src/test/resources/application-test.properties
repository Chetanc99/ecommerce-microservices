spring.datasource.url=jdbc:h2:mem:productdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.cache.type=simple
jwt.secret=test-only-jwt-secret-key-at-least-32-bytes-long
jwt.issuer=ecommerce-auth
jwt.audience=ecommerce-api
internal.api-key=test-internal-key
