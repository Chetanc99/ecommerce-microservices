spring.application.name=ecommerce-payment-service
server.port=8084

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payment_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:ecommerce-auth}
jwt.audience=${JWT_AUDIENCE:ecommerce-api}

order-service.url=${ORDER_SERVICE_URL:http://localhost:8083}
internal.api-key=${INTERNAL_API_KEY:change-me-internal-key}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.poll-interval-ms=5000

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

management.endpoints.web.exposure.include=health,info
