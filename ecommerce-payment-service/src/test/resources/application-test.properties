spring.datasource.url=jdbc:h2:mem:paymentdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=false
jwt.secret=test-only-jwt-secret-key-at-least-32-bytes-long
jwt.issuer=ecommerce-auth
jwt.audience=ecommerce-api
order-service.url=http://localhost:8083
internal.api-key=test-internal-key
razorpay.key-id=
razorpay.key-secret=
razorpay.webhook-secret=
app.outbox.enabled=false
spring.kafka.listener.auto-startup=false
